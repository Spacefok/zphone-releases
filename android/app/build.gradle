plugins { id 'com.android.application' }
android {
    namespace 'org.zphone.pilot'
    compileSdk 34
    defaultConfig {
        applicationId 'org.zphone.preview'
        minSdk 29
        targetSdk 34
        versionCode 10
        versionName '0.3.7'
        ndk { abiFilters 'arm64-v8a' }
    }
    compileOptions { sourceCompatibility JavaVersion.VERSION_17; targetCompatibility JavaVersion.VERSION_17 }
    packaging { jniLibs { useLegacyPackaging = true; keepDebugSymbols += ['**/libmihomo.so','**/libnaive.so'] } }
    signingConfigs {
        preview {
            if (System.getenv('ZPHONE_ANDROID_KEYSTORE')) {
                storeFile file(System.getenv('ZPHONE_ANDROID_KEYSTORE'))
                storePassword System.getenv('ZPHONE_ANDROID_KEY_PASSWORD')
                keyAlias 'zphone-preview'
                keyPassword System.getenv('ZPHONE_ANDROID_KEY_PASSWORD')
            }
        }
    }
    buildTypes { release { minifyEnabled false; signingConfig signingConfigs.preview } }
}
dependencies { implementation files('libs/hev-socks5-tunnel.aar') }
