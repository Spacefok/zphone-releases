plugins { id 'com.android.application' }
android {
    namespace 'org.zphone.pilot'
    compileSdk 34
    defaultConfig {
        applicationId 'org.zphone.pilot'
        minSdk 29
        targetSdk 34
        versionCode 8
        versionName '0.3.5'
        ndk { abiFilters 'arm64-v8a' }
    }
    compileOptions { sourceCompatibility JavaVersion.VERSION_17; targetCompatibility JavaVersion.VERSION_17 }
    packaging { jniLibs { useLegacyPackaging = true; keepDebugSymbols += ['**/libmihomo.so','**/libnaive.so'] } }
    buildTypes { release { minifyEnabled false } }
}
dependencies { implementation files('libs/hev-socks5-tunnel.aar') }
